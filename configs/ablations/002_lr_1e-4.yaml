# M7 ablation 002 — learning rate sweep, arm 1/3 (low).
#
# Everything is identical to configs/micro_50m_8gb.yaml except:
#   - learning_rate / min_lr: 1e-4 / 1e-5 (baseline is 3e-4 / 3e-5 — same 10x
#     peak:min ratio held constant across all three LR arms)
#   - max_iters / lr_decay_iters: 8000, not 40000 (docs/PROJECT.md: ablations
#     run at reduced iters to fit the GPU/time budget; disclosed, not hidden)
#   - warmup_iters is kept at the baseline's absolute value (1000), not
#     rescaled to 8000's proportion — comparing arms with different warmup
#     *fractions* would confound the learning-rate effect with a warmup
#     effect, so the absolute schedule is held fixed across all 002/003/004
#     runs and only the thing each ablation is actually testing changes.
name: ablation_002_lr_1e-4

model:
  n_layer: 8
  n_head: 8
  n_embd: 592
  block_size: 512
  vocab_size: 32000
  dropout: 0.0
  bias: false

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  max_iters: 8000
  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_iters: 1000
  lr_decay_iters: 8000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 100
  log_interval: 25
  checkpoint_interval: 2000

precision: bfloat16
gradient_checkpointing: false
compile: false

data:
  dataset: tinystories
  max_train_tokens: 357852786
  val_split: 0.05

seed: 42
