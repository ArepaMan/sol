# M7 ablation 003 — data scale, arm 1/2 (100M vs the full ~357.85M corpus).
#
# "Equal iteration count" per docs/ROADMAP.md M7: this run and its full-data
# counterpart (configs/ablations/002_lr_3e-4.yaml, reused — see that file's
# header) both train for exactly 8000 iters / 262,144,000 tokens processed.
# The 100M-token arm therefore repeats its smaller slice of train ~2.62x
# over the run while the full-data arm sees ~0.73 epochs without repetition —
# this ablation is about data *diversity*, not compute, by design.
#
# max_train_tokens now actually restricts BinDataset's sampling range (see
# src/data.py — through M5/M6 this field was descriptive only).
name: ablation_003_data_100m

model:
  n_layer: 8
  n_head: 8
  n_embd: 592
  block_size: 512
  vocab_size: 32000
  dropout: 0.0
  bias: false

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  max_iters: 8000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 1000
  lr_decay_iters: 8000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 100
  log_interval: 25
  checkpoint_interval: 2000

precision: bfloat16
gradient_checkpointing: false
compile: false

data:
  dataset: tinystories
  max_train_tokens: 100000000
  val_split: 0.05

seed: 42
